name: Deploy OpenCart to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-opencart
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://katya-dev.duckdns.org/' }}
  OPENCART_VERSION: "4.1.0.3"

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          OPENCART_DB_PASSWORD: ${{ secrets.OPENCART_DB_PASSWORD }}
          OPENCART_DB_ROOT_PASSWORD: ${{ secrets.OPENCART_DB_ROOT_PASSWORD }}
          OPENCART_ADMIN_PASSWORD: ${{ secrets.OPENCART_ADMIN_PASSWORD }}
          OPENCART_ADMIN_EMAIL: ${{ vars.OPENCART_ADMIN_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing repository variable DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing repository variable DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing repository variable DEPLOY_PATH"; exit 1; }
          test "$DEPLOY_PATH" != "/" || { echo "DEPLOY_PATH cannot be /"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing production secret DEPLOY_KNOWN_HOSTS"; exit 1; }
          test -n "$OPENCART_DB_PASSWORD" || { echo "Missing production secret OPENCART_DB_PASSWORD"; exit 1; }
          test -n "$OPENCART_DB_ROOT_PASSWORD" || { echo "Missing production secret OPENCART_DB_ROOT_PASSWORD"; exit 1; }
          test -n "$OPENCART_ADMIN_PASSWORD" || { echo "Missing production secret OPENCART_ADMIN_PASSWORD"; exit 1; }
          test -n "$OPENCART_ADMIN_EMAIL" || { echo "Missing repository variable OPENCART_ADMIN_EMAIL"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Package deployment source
        run: git archive --format=tar.gz --output=noveraile-opencart.tar.gz "$GITHUB_SHA"

      - name: Prepare protected runtime settings
        env:
          OPENCART_DB_PASSWORD: ${{ secrets.OPENCART_DB_PASSWORD }}
          OPENCART_DB_ROOT_PASSWORD: ${{ secrets.OPENCART_DB_ROOT_PASSWORD }}
          OPENCART_ADMIN_PASSWORD: ${{ secrets.OPENCART_ADMIN_PASSWORD }}
          OPENCART_ADMIN_EMAIL: ${{ vars.OPENCART_ADMIN_EMAIL }}
          OPENCART_ADMIN_USERNAME: ${{ vars.OPENCART_ADMIN_USERNAME || 'admin' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -Eeuo pipefail
          umask 077
          {
            printf 'OPENCART_VERSION=%s\n' "$OPENCART_VERSION"
            printf 'OPENCART_HTTP_SERVER=%s\n' "$PRODUCTION_URL"
            printf 'OPENCART_DB_NAME=opencart\n'
            printf 'OPENCART_DB_USER=opencart\n'
            printf 'OPENCART_DB_PASSWORD=%s\n' "$OPENCART_DB_PASSWORD"
            printf 'OPENCART_DB_ROOT_PASSWORD=%s\n' "$OPENCART_DB_ROOT_PASSWORD"
            printf 'OPENCART_DB_PREFIX=oc_\n'
            printf 'OPENCART_ADMIN_USERNAME=%s\n' "$OPENCART_ADMIN_USERNAME"
            printf 'OPENCART_ADMIN_PASSWORD=%s\n' "$OPENCART_ADMIN_PASSWORD"
            printf 'OPENCART_ADMIN_EMAIL=%s\n' "$OPENCART_ADMIN_EMAIL"
            printf 'MODULE_IMAGE_TAG=%s\n' "$GITHUB_SHA"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
          } > .env.runtime

      - name: Upload release
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            noveraile-opencart.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/noveraile-$GITHUB_SHA.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            .env.runtime \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/noveraile-$GITHUB_SHA.env"

      - name: Deploy clean OpenCart with current module
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='$GITHUB_SHA' ARCHIVE='/tmp/noveraile-$GITHUB_SHA.tar.gz' RUNTIME_ENV='/tmp/noveraile-$GITHUB_SHA.env' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          case "$DEPLOY_PATH" in
            ""|"/") echo "Unsafe DEPLOY_PATH"; exit 1 ;;
          esac

          release_dir="$DEPLOY_PATH/releases/$RELEASE_SHA"
          mkdir -p "$release_dir" "$DEPLOY_PATH/backups"
          tar -xzf "$ARCHIVE" -C "$release_dir"
          mv "$RUNTIME_ENV" "$release_dir/.env.runtime"
          chmod 600 "$release_dir/.env.runtime"

          if docker container inspect noveraile-db >/dev/null 2>&1; then
            test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' noveraile-db)" = "healthy" || {
              echo "Existing OpenCart database is not healthy; refusing to create an invalid backup"
              exit 1
            }
            backup="$DEPLOY_PATH/backups/opencart-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            docker exec noveraile-db sh -c \
              'exec mysqldump --single-transaction --no-tablespaces -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' \
              | gzip > "$backup"
            find "$DEPLOY_PATH/backups" -type f -name 'opencart-*.sql.gz' -mtime +14 -delete
          fi

          cd "$release_dir"
          docker network inspect web-edge >/dev/null 2>&1 || docker network create web-edge
          docker compose --env-file .env.runtime -p noveraile build opencart
          docker compose --env-file .env.runtime -p noveraile up -d db
          docker compose --env-file .env.runtime -p noveraile up -d --remove-orphans

          # A release that changes the catalog feed imports it before Apache
          # starts, so allow for a full catalog rewrite here.
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' noveraile-store)" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              docker logs --tail 200 noveraile-store
              echo "OpenCart container did not become healthy"
              exit 1
            fi
            sleep 5
          done

          # Caddy resolves Docker service names when its configuration is
          # loaded. Refresh that resolution after Compose replaces the store
          # container, otherwise the public domain can keep serving the
          # previous container even though the new one is already healthy.
          reloaded_edge_proxies=0
          for candidate in $(docker ps --filter network=web-edge --format '{{.ID}}'); do
            if ! docker exec "$candidate" caddy version >/dev/null 2>&1; then
              continue
            fi

            if docker exec "$candidate" test -f /etc/caddy/Caddyfile; then
              docker exec "$candidate" caddy reload --force --config /etc/caddy/Caddyfile --adapter caddyfile
              reloaded_edge_proxies=$((reloaded_edge_proxies + 1))
            elif docker exec "$candidate" test -f /config/caddy/autosave.json; then
              docker exec "$candidate" caddy reload --force --config /config/caddy/autosave.json
              reloaded_edge_proxies=$((reloaded_edge_proxies + 1))
            fi
          done
          test "$reloaded_edge_proxies" -gt 0 || { echo "No reloadable Caddy container was found on web-edge"; exit 1; }

          ln -sfn "$release_dir" "$DEPLOY_PATH/current"
          rm -f "$ARCHIVE"
          docker compose --env-file .env.runtime -p noveraile ps
          REMOTE

      - name: Verify production
        run: |
          set -Eeuo pipefail
          expected_script="$(grep -o 'noveraile\.js?v=[0-9.]*' opencart/noveraile/catalog/controller/event/theme.php | head -n 1)"
          expected_stylesheet="$(grep -o 'noveraile\.css?v=[0-9.]*' opencart/noveraile/catalog/controller/event/theme.php | head -n 1)"
          test -n "$expected_script" || { echo "Expected script version was not found"; exit 1; }
          test -n "$expected_stylesheet" || { echo "Expected stylesheet version was not found"; exit 1; }

          for attempt in $(seq 1 36); do
            storefront="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL}?release=$GITHUB_SHA" || true)"
            admin="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL%/}/admin/" || true)"
            if grep -q 'class="noveraile-store"' <<<"$storefront" \
              && grep -Fq "$expected_script" <<<"$storefront" \
              && grep -Fq "$expected_stylesheet" <<<"$storefront" \
              && grep -q '<title>Administration</title>' <<<"$admin"; then
              echo "Production is healthy: $PRODUCTION_URL"
              exit 0
            fi
            echo "Waiting for OpenCart ($attempt/36)"
            sleep 5
          done
          echo "Production did not become healthy in time"
          exit 1
