name: Validate and deploy OpenCart module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-production.yml"
      - ".dockerignore"
      - ".env.example"
      - "Caddyfile"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.local.yml"
      - "docker/**"
      - "opencart/sixmoments/**"
  workflow_dispatch:

concurrency:
  group: production-opencart
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://katya-dev.duckdns.org/' }}
  OPENCART_VERSION: "4.1.0.3"

jobs:
  validate:
    name: Validate module and image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate extension manifest
        run: |
          set -Eeuo pipefail
          jq --exit-status '
            .name == "6MOMENTS Storefront Suite" and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.author | length > 0)
          ' opencart/sixmoments/install.json >/dev/null

      - name: Check PHP syntax
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$PWD/opencart/sixmoments:/module:ro" \
            php:8.3-cli \
            sh -ec 'find /module -type f -name "*.php" -exec php -l {} \;'

      - name: Build installable module package
        run: |
          set -Eeuo pipefail
          cd opencart/sixmoments
          zip -qr ../../sixmoments.ocmod.zip .
          unzip -l ../../sixmoments.ocmod.zip

      - name: Build clean OpenCart image with module overlay
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg "OPENCART_VERSION=$OPENCART_VERSION" \
            --tag "sixmoments-opencart:${GITHUB_SHA}" \
            .

      - name: Upload module package
        uses: actions/upload-artifact@v6
        with:
          name: sixmoments-opencart-module
          path: sixmoments.ocmod.zip
          if-no-files-found: error

  deploy:
    name: Deploy module to Hetzner
    needs: validate
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          OPENCART_DB_PASSWORD: ${{ secrets.OPENCART_DB_PASSWORD }}
          OPENCART_DB_ROOT_PASSWORD: ${{ secrets.OPENCART_DB_ROOT_PASSWORD }}
          OPENCART_ADMIN_PASSWORD: ${{ secrets.OPENCART_ADMIN_PASSWORD }}
          OPENCART_ADMIN_EMAIL: ${{ vars.OPENCART_ADMIN_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing repository variable DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing repository variable DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing repository variable DEPLOY_PATH"; exit 1; }
          test "$DEPLOY_PATH" != "/" || { echo "DEPLOY_PATH cannot be /"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing production secret DEPLOY_KNOWN_HOSTS"; exit 1; }
          test -n "$OPENCART_DB_PASSWORD" || { echo "Missing production secret OPENCART_DB_PASSWORD"; exit 1; }
          test -n "$OPENCART_DB_ROOT_PASSWORD" || { echo "Missing production secret OPENCART_DB_ROOT_PASSWORD"; exit 1; }
          test -n "$OPENCART_ADMIN_PASSWORD" || { echo "Missing production secret OPENCART_ADMIN_PASSWORD"; exit 1; }
          test -n "$OPENCART_ADMIN_EMAIL" || { echo "Missing repository variable OPENCART_ADMIN_EMAIL"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Package deployment source
        run: git archive --format=tar.gz --output=sixmoments-opencart.tar.gz "$GITHUB_SHA"

      - name: Prepare protected runtime settings
        env:
          OPENCART_DB_PASSWORD: ${{ secrets.OPENCART_DB_PASSWORD }}
          OPENCART_DB_ROOT_PASSWORD: ${{ secrets.OPENCART_DB_ROOT_PASSWORD }}
          OPENCART_ADMIN_PASSWORD: ${{ secrets.OPENCART_ADMIN_PASSWORD }}
          OPENCART_ADMIN_EMAIL: ${{ vars.OPENCART_ADMIN_EMAIL }}
          OPENCART_ADMIN_USERNAME: ${{ vars.OPENCART_ADMIN_USERNAME || 'admin' }}
        run: |
          set -Eeuo pipefail
          umask 077
          {
            printf 'OPENCART_VERSION=%s\n' "$OPENCART_VERSION"
            printf 'OPENCART_HTTP_SERVER=%s\n' "$PRODUCTION_URL"
            printf 'OPENCART_DB_NAME=opencart\n'
            printf 'OPENCART_DB_USER=opencart\n'
            printf 'OPENCART_DB_PASSWORD=%s\n' "$OPENCART_DB_PASSWORD"
            printf 'OPENCART_DB_ROOT_PASSWORD=%s\n' "$OPENCART_DB_ROOT_PASSWORD"
            printf 'OPENCART_DB_PREFIX=oc_\n'
            printf 'OPENCART_ADMIN_USERNAME=%s\n' "$OPENCART_ADMIN_USERNAME"
            printf 'OPENCART_ADMIN_PASSWORD=%s\n' "$OPENCART_ADMIN_PASSWORD"
            printf 'OPENCART_ADMIN_EMAIL=%s\n' "$OPENCART_ADMIN_EMAIL"
            printf 'MODULE_IMAGE_TAG=%s\n' "$GITHUB_SHA"
          } > .env.runtime

      - name: Upload release
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            sixmoments-opencart.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sixmoments-$GITHUB_SHA.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            .env.runtime \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sixmoments-$GITHUB_SHA.env"

      - name: Deploy clean OpenCart with current module
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='$GITHUB_SHA' ARCHIVE='/tmp/sixmoments-$GITHUB_SHA.tar.gz' RUNTIME_ENV='/tmp/sixmoments-$GITHUB_SHA.env' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          case "$DEPLOY_PATH" in
            ""|"/") echo "Unsafe DEPLOY_PATH"; exit 1 ;;
          esac

          release_dir="$DEPLOY_PATH/releases/$RELEASE_SHA"
          mkdir -p "$release_dir" "$DEPLOY_PATH/backups"
          tar -xzf "$ARCHIVE" -C "$release_dir"
          mv "$RUNTIME_ENV" "$release_dir/.env.runtime"
          chmod 600 "$release_dir/.env.runtime"

          available_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          if [ "$available_kb" -lt 6291456 ]; then
            echo "Low disk space detected; pruning recoverable caches before the image build"
            journalctl --vacuum-size=256M || true
            docker builder prune -af
            docker image prune -af
          fi

          if docker container inspect sixmoments-db >/dev/null 2>&1; then
            test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' sixmoments-db)" = "healthy" || {
              echo "Existing OpenCart database is not healthy; refusing to create an invalid backup"
              exit 1
            }
            backup="$DEPLOY_PATH/backups/opencart-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            docker exec sixmoments-db sh -c \
              'exec mysqldump --single-transaction --no-tablespaces -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' \
              | gzip > "$backup"
            find "$DEPLOY_PATH/backups" -type f -name 'opencart-*.sql.gz' -mtime +14 -delete
          fi

          cd "$release_dir"
          docker network inspect web-edge >/dev/null 2>&1 || docker network create web-edge
          docker compose --env-file .env.runtime -p sixmoments build --pull opencart
          docker compose --env-file .env.runtime -p sixmoments up -d db

          if docker container inspect sixmoments-store >/dev/null 2>&1; then
            docker rm -f sixmoments-store
          fi

          docker compose --env-file .env.runtime -p sixmoments up -d --remove-orphans

          for attempt in $(seq 1 36); do
            if [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' sixmoments-store)" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              docker logs --tail 200 sixmoments-store
              echo "OpenCart container did not become healthy"
              exit 1
            fi
            sleep 5
          done

          caddyfile=/opt/incora/Caddyfile
          if [ -f "$caddyfile" ]; then
            if grep -q 'six-moments-atelier.jenyaukraine.chatgpt.site' "$caddyfile"; then
              cp -a "$caddyfile" "$DEPLOY_PATH/backups/Caddyfile-$(date -u +%Y%m%dT%H%M%SZ)"
              perl -0pe 's#reverse_proxy https://six-moments-atelier\.jenyaukraine\.chatgpt\.site \{\s*header_up Host six-moments-atelier\.jenyaukraine\.chatgpt\.site\s*\}#reverse_proxy sixmoments-store:3000#s' \
                "$caddyfile" > "$caddyfile.next"
              cat "$caddyfile.next" > "$caddyfile"
              rm -f "$caddyfile.next"
            fi
            grep -q 'reverse_proxy sixmoments-store:3000' "$caddyfile" || {
              echo "Caddy route for katya-dev.duckdns.org is not configured for OpenCart"
              exit 1
            }
            docker exec inkora-caddy caddy validate --config /etc/caddy/Caddyfile
            docker exec inkora-caddy caddy reload --config /etc/caddy/Caddyfile
          fi

          ln -sfn "$release_dir" "$DEPLOY_PATH/current"
          rm -f "$ARCHIVE"
          docker compose --env-file .env.runtime -p sixmoments ps
          REMOTE

      - name: Verify production
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 36); do
            storefront="$(curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL" || true)"
            admin="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL%/}/admin/" || true)"
            if grep -q 'catalog/view' <<<"$storefront" && grep -q '<title>Administration</title>' <<<"$admin"; then
              echo "Production is healthy: $PRODUCTION_URL"
              exit 0
            fi
            echo "Waiting for OpenCart ($attempt/36)"
            sleep 5
          done
          echo "Production did not become healthy in time"
          exit 1
