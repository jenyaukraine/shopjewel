# Concurrency budget for the storefront container.
#
# Every Apache child runs mod_php, so it holds one OpenCart request and one
# MySQL connection for the whole of that request. Debian ships mpm_prefork with
# MaxRequestWorkers 150, which is larger than MySQL's own connection limit and
# far larger than this container's memory budget: a crawler or a cold facet
# cache is enough to put 150 children in flight, and the storefront answers
# every visitor with "Too many connections" until the burst passes.
#
# The cap below is derived from the container memory limit in docker-compose.yml
# (768 MB) and the observed resident size of an OpenCart request (~45 MB):
# 16 workers leave room for the PHP CLI importer and the entrypoint. Raise both
# ServerLimit and MaxRequestWorkers together, and only alongside mem_limit.
<IfModule mpm_prefork_module>
    StartServers            3
    MinSpareServers         2
    MaxSpareServers         6
    ServerLimit             16
    MaxRequestWorkers       16
    # Recycle children so a leaked resource cannot accumulate for the lifetime
    # of the container.
    MaxConnectionsPerChild  500
</IfModule>

# A keep-alive child occupies one of the sixteen slots while the browser sits
# idle, so the window stays short. Caddy terminates TLS in front of this, which
# is where long-lived client connections belong.
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2

# A request that has not finished in a minute is never going to help the
# visitor, and until it gives up it holds both a worker and its connection.
Timeout 60
